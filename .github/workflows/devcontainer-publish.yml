name: DevContainer Prebuild and Publish to GHCR

on:
  push:
    branches:
      - main
    paths:
      - .devcontainer/**
  pull_request:
    paths:
      - .devcontainer/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      
    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Pre-build dev container image
      uses: devcontainers/ci@v0.3
      with:
        imageName: ghcr.io/${{ github.repository }}
        cacheFrom: ghcr.io/matthewbegun/quartato
        push: always
